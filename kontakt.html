<!DOCTYPE html>
<html lang="sv">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boka bord – Kafé Kardemumma</title>
</head>

<body>
  <header>
    <h1>Kafé Kardemumma</h1>
    <nav aria-label="Huvudmeny">
      <ul>
        <li><a href="index.html">Startsida</a></li>
        <li><a href="index.html#meny">Meny</a></li>
        <li><a href="kontakt.html" aria-current="page">Boka bord</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h2>Boka bord</h2>
    <!-- TODO: Skriv ingressen från innehall.md -->
    <p>Fyll i formuläret så bekräftar vi din bokning inom ett dygn.
      Fält markerade med * är obligatoriska.</p>
    <form action="#" method="post">
      <!-- TODO 1: fält för namn, e-post, telefon, datum (label + input med for/id) -->
      <div class="falt">
        <label for="namn">Namn *</label>
        <input type="text" id="namn" name="namn" autocomplete="name" required>
      </div>
      <div class="falt">
        <label for="epost">E-postadress *</label>
        <input type="email" id="epost" name="epost" autocomplete="email" required>
      </div>
      <div class="falt">
        <label for="telefon">Telefon (valfritt)</label>
        <input type="tel" id="telefon" name="telefon" autocomplete="tel">
      </div>
      <div class="falt">
        <label for="datum">Datum *</label>
        <input type="date" id="datum" name="datum" required>
      </div>
      <!-- TODO 2: rullista för antal personer, textarea för önskemål -->
      <select name="antal-personer" id="antal-personer" required>
        <option value="">Välj antal personer</option>
        <option value="1">1 person</option>
        <option value="2">2 personer</option>
        <option value="3">3 personer</option>
        <option value="4">4 personer</option>
        <option value="5">5 eller fler personer</option>
      </select>
      <!-- TODO 3: fieldset + legend för kostönskemål och bekräftelsesätt -->
      <fieldset>
        <legend>Kostönskemål</legend>
        <div class="falt">
          <input type="checkbox" id="vegetarisk" name="vegetarisk" value="vegetarisk">
          <label for="vegetarisk">Vegetarisk</label>
        </div>
        <div class="falt">
          <input type="checkbox" id="vegansk" name="vegansk" value="vegansk">
          <label for="vegansk">Vegansk</label>
        </div>
        <div class="falt">
          <input type="checkbox" id="glutenfri" name="gluten" value="glutenfri">
          <label for="glutenfri">Glutenfri</label>
        </div>
      </fieldset>
      <textarea name="onskemal" id="onskemal" rows="4" placeholder="Skriv eventuella önskemål här..."></textarea>
      <fieldset>
        <legend>Hur vill du få bekräftelsen? *</legend>
        <div class="falt">
          <input type="radio" id="bekraftelse-epost" name="bekraftelse" value="epost" required>
          <label for="bekraftelse-epost">Bekräftelse via e-post</label>
        </div>
        <div class="falt">
          <input type="radio" id="bekraftelse-sms" name="bekraftelse" value="sms">
          <label for="bekraftelse-sms">Bekräftelse via SMS</label>
        </div>
        <!-- TODO 4: samtyckeskryssruta (required) och skickaknapp -->
    </form>
  </main>

  <footer>
    <p>&copy; 2026 Kafé Kardemumma</p>
    <address>
      Fiktivgatan 1, 111 11 Stockholm<br>
      <a href="mailto:hej@kardemumma.example">hej@kardemumma.example</a>
    </address>
  </footer>
</body>

</html>
